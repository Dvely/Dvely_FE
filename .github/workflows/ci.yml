name: CI

# main 병합이 곧 EC2 배포이므로(deploy-ec2.yml) 검증은 병합 전에 끝나야 한다.
# 이 워크플로가 PR에서 실패하면 병합을 막는 것이 전제다 — GitHub 저장소 설정에서
# main 보호 규칙에 "Typecheck and build"를 required status check로 걸어야 실제로 막힌다.
# 워크플로 파일만으로는 강제되지 않는다.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# PR에 커밋을 연달아 밀면 앞선 실행은 취소한다. 배포와 달리 중간 상태가 남지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # npm이 아니라 bun인 이유: package-lock.json은 2026-05-25 이후 갱신이 끊겼고
      # package.json과 어긋나 `npm ci`가 EUSAGE로 거부한다(i18next / react-i18next /
      # react-query-devtools 누락). 실제로 유지되는 락파일은 bun.lock 쪽이다
      # — package.json을 바꾼 마지막 커밋(2c61c23 "i18n 라이브러리 추가")에서 함께 갱신됐다.
      # 버전을 고정하는 이유는 bun.lock 포맷이 bun 버전에 묶여 있어서다.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # --frozen-lockfile: 락파일과 package.json이 어긋나면 조용히 락파일을 고쳐 쓰는 대신
      # 실패시킨다. 이게 없으면 CI만 통과하고 배포 시점에 다른 의존성이 깔리는 사고가 난다.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build에 tsc -b가 이미 들어 있지만 따로 돌린다. 빌드가 깨질 때
      # 타입 문제인지 번들 문제인지 로그에서 바로 갈리기 때문이다.
      - name: Typecheck
        run: bun run typecheck

      # 현재 main에는 lint 에러가 17건 남아 있다(대부분 react-refresh/only-export-components).
      # 배포를 막을 성질의 문제가 아니라서 지금은 실패해도 진행시키되, 결과는 보이게 둔다.
      # 재고 정리가 끝나면 이 줄만 지우면 곧바로 차단 검사가 된다.
      - name: Lint
        continue-on-error: true
        run: bun run lint

      # 여기서 굽는 값은 검증용 더미다. 실제 프로덕션 값은 deploy-ec2.yml이 주입한다.
      # 다만 비워두면 axios baseURL이 undefined가 되어 "빌드는 됐는데 런타임에 전부
      # 404" 인 상태를 그대로 통과시키므로, 형태가 있는 값을 넣어 둔다.
      - name: Build
        env:
          VITE_API_URL: https://qeploy.com/api/v1
        run: bun run build
