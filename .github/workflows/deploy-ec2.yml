name: Deploy to EC2

# ─────────────────────────────────────────────────────────────────────────────
# 지금은 수동 트리거(workflow_dispatch)만 열어 두었다.
#
# 이유: 서버가 서비스 중인 빌드는 6ecb826(2026-05-28)이고 main은 c9d9ae7(2026-06-16)로
# 78커밋 앞서 있다. 그 사이 백엔드 API가 V12→V30으로 크게 바뀌어 호환성이 깨질 수 있다.
# push 트리거를 처음부터 켜 두면 이 워크플로를 main에 병합하는 순간 78커밋이 그대로
# 프로덕션에 올라간다 — 워크플로 파일 자체가 push 이벤트를 일으키기 때문이다.
#
# 수동 배포로 한 번 정상 동작을 확인한 뒤, 아래 push 블록의 주석을 풀면
# "main 병합 = 자동 배포"가 된다. 그때는 main 보호 규칙에 CI를 required로 걸어야
# 검증을 건너뛴 직접 푸시가 그대로 배포되는 일이 없다.
#
# push가 아니라 pull_request가 아닌 이유: pull_request는 병합 결과가 아니라 병합 후보를
# 빌드하고, 포크 PR에는 시크릿이 내려가지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

# 병합이 연달아 일어나도 배포가 겹치지 않게 직렬화한다.
# 배포 도중 취소하면 서버가 어중간한 상태로 남으므로 cancel-in-progress는 끈다.
concurrency:
  group: deploy-frontend-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  # /var/www/dvely 이하는 전부 ubuntu 소유라 배포 전 과정에 sudo가 필요 없다.
  # nginx 설정은 건드리지 않는다 — 정적 파일 교체만으로 반영되기 때문에 reload도 불필요하다.
  FRONTEND_DIR: /var/www/dvely/frontend
  # 백엔드 배포가 /var/www/dvely/staging 을 쓰고 있어 일부러 분리한다.
  # 같은 디렉터리를 공유하면 배포가 겹칠 때 서로의 산출물을 지운다.
  STAGING_DIR: /var/www/dvely/frontend/staging
  # 롤백용으로 남길 이전 릴리스 개수. 한 릴리스가 약 27MB다.
  KEEP_RELEASES: 5

jobs:
  deploy:
    name: Build and deploy ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # npm이 아니라 bun을 쓰는 이유는 ci.yml 주석 참고(package-lock.json이 깨져 있다).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # VITE_API_URL은 빌드 시점에 번들로 구워진다. 런타임 주입이 불가능하므로
      # 서버에서 고칠 수 없고, 비어 있으면 axios baseURL이 undefined가 되어
      # 모든 API 호출이 same-origin으로 나간다. nginx는 /api/ 만 백엔드로 넘기므로
      # /auth/... 같은 경로는 SPA fallback에 걸려 index.html(HTML)이 돌아온다.
      # 2026-05-29 배포본이 실제로 이 상태였다. 그래서 빌드 전에 값을 강제한다.
      - name: Resolve build-time API URL
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::저장소 변수 VITE_API_URL이 비어 있습니다. Settings > Secrets and variables > Actions > Variables 에 https://qeploy.com/api/v1 을 등록하세요."
            exit 1
          fi
          echo "빌드 대상 API: ${VITE_API_URL}"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bun run build

      # 빌드가 조용히 비어 나오는 경우(플러그인 실패, 잘못된 base 등)를 여기서 잡는다.
      # 그리고 실제로 우리가 의도한 API URL이 번들에 박혔는지 대조한다 — 이 확인이 없으면
      # 위의 사고가 똑같이 반복돼도 배포는 성공으로 끝난다.
      - name: Verify build output
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html이 없습니다. 빌드가 산출물을 내지 못했습니다."
            exit 1
          fi
          if ! grep -rqF "${VITE_API_URL}" dist/assets/*.js; then
            echo "::error::번들에서 ${VITE_API_URL} 을 찾지 못했습니다. VITE_API_URL이 빌드에 반영되지 않았습니다."
            exit 1
          fi
          echo "산출물 크기: $(du -sh dist | cut -f1)"

      # 디렉터리를 통째로 scp하면 파일 수천 개마다 왕복이 생겨 느리고, 중간에 끊기면
      # 절반만 올라간 상태를 구분할 수 없다. tar 하나로 묶어 체크섬까지 같이 올린다.
      # 체크섬 파일에는 경로 없이 파일명만 담아야 staging에서 `sha256sum -c`가 통한다.
      - name: Pack artifact
        run: |
          set -euo pipefail
          tar -czf dist.tar.gz -C dist .
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          echo "전송 크기: $(du -h dist.tar.gz | cut -f1)"

      # 이전 배포가 남긴 찌꺼기 위에 덮어쓰지 않도록 비우고 시작한다.
      - name: Clean staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: STAGING_DIR
          script_stop: true
          script: |
            set -euo pipefail
            rm -rf "${STAGING_DIR}"
            mkdir -p "${STAGING_DIR}"

      - name: Upload artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: dist.tar.gz,dist.tar.gz.sha256
          target: /var/www/dvely/frontend/staging

      - name: Swap release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: FRONTEND_DIR,STAGING_DIR,KEEP_RELEASES,RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail

            # 업로드된 tar가 빌드 산출물 그대로인지 대조한다.
            cd "${STAGING_DIR}"
            if ! sha256sum -c --status dist.tar.gz.sha256; then
              echo "::error::tar 체크섬이 일치하지 않습니다. 배포를 중단합니다."
              exit 1
            fi

            # 릴리스는 먼저 완성해 두고, 마지막에 심볼릭 링크만 갈아끼운다.
            # 압축을 푸는 동안에는 dist가 여전히 옛 릴리스를 가리키고 있어
            # 사용자는 반쯤 풀린 디렉터리를 볼 일이 없다.
            release_dir="${FRONTEND_DIR}/releases/${RELEASE_SHA}"
            rm -rf "${release_dir}"
            mkdir -p "${release_dir}"
            tar -xzf dist.tar.gz -C "${release_dir}"

            if [ ! -s "${release_dir}/index.html" ]; then
              echo "::error::압축 해제 결과에 index.html이 없습니다."
              exit 1
            fi

            # tar는 아카이브에 담긴 '.' 엔트리의 mtime을 릴리스 디렉터리에 그대로 씌운다.
            # 그 값은 러너에서 빌드한 시각이고 초 단위라, 아래 정리 단계의 시간 정렬이
            # 동률에 빠질 수 있다. 배포 시각으로 다시 찍어 순서를 확정한다.
            touch "${release_dir}"

            cd "${FRONTEND_DIR}"

            # nginx는 www-data로 돌고 root가 이 경로다. 755가 아니면 403이 난다.
            chmod -R a+rX "releases/${RELEASE_SHA}"

            # ── 1회성 이관 ──────────────────────────────────────────────
            # 기존 dist는 심볼릭 링크가 아니라 실제 디렉터리다(2026-05-29 수동 배포).
            # ln 도, mv -T 도 디렉터리를 심볼릭 링크로 덮어쓰지 못하므로 한 번은
            # 비켜줘야 한다. 이 구간에만 아주 짧게 dist가 없는 순간이 생긴다.
            # 두 번째 배포부터는 아래 mv -T 한 번으로 원자적으로 교체된다.
            if [ ! -L dist ] && [ -d dist ]; then
              echo "기존 dist 디렉터리를 releases/legacy-manual 로 이관합니다."
              rm -rf releases/legacy-manual
              mv dist releases/legacy-manual
            fi
            # ────────────────────────────────────────────────────────────

            # 롤백 대상을 기억해 둔다. 교체 전에 읽어야 현재 릴리스가 잡힌다.
            prev_target=$(readlink dist || true)

            # 상대 경로로 거는 이유: 나중에 frontend 디렉터리를 통째로 옮겨도 링크가 살아 있다.
            # mv -T 는 rename(2) 이라 원자적이다. rm 후 ln 으로 하면 그 사이 요청이 404를 받는다.
            ln -sfn "releases/${RELEASE_SHA}" dist.tmp
            mv -T dist.tmp dist

            if [ -n "${prev_target}" ]; then
              ln -sfn "${prev_target}" prev.tmp
              mv -T prev.tmp prev
            fi

            rm -rf "${STAGING_DIR}"

            # 오래된 릴리스 정리. 현재 릴리스와 직전 릴리스(prev)는 절대 지우지 않는다.
            #
            # `ls -t` 가 아니라 find + %T@ 로 정렬하는 이유: ls의 시간 정렬은 초 단위라
            # 같은 초에 만들어진 디렉터리끼리 동률이 나면 이름순으로 떨어진다. 그러면
            # 오래된 릴리스가 아니라 이름이 뒤인 최신 릴리스가 지워진다 — 실제로 확인했다.
            # %T@ 는 나노초까지 찍으므로 동률이 생기지 않는다.
            keep_current="releases/${RELEASE_SHA}"
            keep_prev="${prev_target:-}"
            find releases -mindepth 1 -maxdepth 1 -type d -printf '%T@\t%P\n' \
              | sort -rn | tail -n +$((KEEP_RELEASES + 1)) | cut -f2- | while read -r name; do
              old="releases/${name}"
              [ "${old}" = "${keep_current}" ] && continue
              [ "${old}" = "${keep_prev}" ] && continue
              echo "오래된 릴리스 삭제: ${old}"
              rm -rf "${old}"
            done

            echo "${RELEASE_SHA} 교체 완료 (직전: ${prev_target:-없음})"
        env:
          # 커밋 메시지나 브랜치명은 원격 셸로 넘기지 않는다. 이 값들은 작성자가 임의로
          # 정할 수 있어 따옴표나 명령 치환이 섞여 들어갈 수 있다. sha는 16진수뿐이라 안전하다.
          RELEASE_SHA: ${{ github.sha }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: FRONTEND_DIR,RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail
            cd "${FRONTEND_DIR}"

            # 서버 안에서 origin(127.0.0.1)을 직접 때린다. 밖에서 qeploy.com을 부르면
            # Cloudflare 캐시가 옛 index.html을 돌려줄 수 있어 배포 검증이 되지 않는다.
            # -k 는 인증서가 Cloudflare Origin 전용(호스트명 불일치)이라 필요하다.
            served=$(curl -fsS -k -H 'Host: qeploy.com' https://127.0.0.1/)
            expected=$(cat "releases/${RELEASE_SHA}/index.html")
            if [ "${served}" != "${expected}" ]; then
              echo "::error::nginx가 내주는 index.html이 이번 릴리스와 다릅니다."
              exit 1
            fi

            # index.html만 맞고 asset이 없으면 화면은 백지가 된다. 실제로 하나 받아 본다.
            asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' "releases/${RELEASE_SHA}/index.html" | head -1)
            if [ -z "${asset}" ]; then
              echo "::error::index.html에서 asset 참조를 찾지 못했습니다."
              exit 1
            fi
            curl -fsS -k -o /dev/null -H 'Host: qeploy.com' "https://127.0.0.1${asset}"

            # 백엔드 프록시가 살아 있는지도 같이 본다. 프론트 배포가 깨뜨릴 일은 없지만,
            # 배포 직후 "사이트가 안 된다"는 신고가 들어왔을 때 원인을 가르는 데 쓴다.
            curl -fsS -k -o /dev/null -H 'Host: qeploy.com' https://127.0.0.1/api/v1/auth/github/url

            echo "검증 통과: ${RELEASE_SHA} (asset ${asset})"
        env:
          RELEASE_SHA: ${{ github.sha }}

      # 검증이 깨졌을 때 손으로 되돌리는 절차를 로그에 남긴다.
      # 자동 롤백을 넣지 않은 이유: index.html 불일치는 캐시나 nginx 설정 문제일 수도 있어
      # 되돌리는 게 항상 정답은 아니다. 사람이 보고 판단하는 편이 안전하다.
      - name: Rollback instructions
        if: failure()
        run: |
          echo "배포 검증에 실패했습니다. 직전 릴리스로 되돌리려면:"
          echo "  ssh dvely"
          echo "  cd /var/www/dvely/frontend"
          echo "  ln -sfn \"\$(readlink prev)\" dist.tmp && mv -T dist.tmp dist"
          echo "  ls -1dt releases/*/   # 남아 있는 릴리스 확인"
