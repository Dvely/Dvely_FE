name: Deploy to GitHub Pages

# main에 커밋이 올라오면(= PR 병합 시) GitHub Pages로 배포한다.
#
# 2026-10-30 AWS 지원이 끝나 운영 EC2를 비우면서 deploy-ec2.yml을 이것으로 바꿨다.
# 정적 산출물만 올리면 되므로 서버·SSH 키·릴리스 디렉터리가 모두 없어졌다.
# 도메인(qeploy.com)은 저장소 Settings > Pages의 custom domain과 Cloudflare DNS로 붙는다
# — 자세한 건 deploy/README.md.
#
# 백엔드는 함께 옮기지 않았다. 예전 nginx처럼 /api/ 를 받아 줄 서버가 없으므로,
# 백엔드가 다른 주소로 다시 뜨기 전까지 로그인 이후 화면은 동작하지 않는다.
#
# workflow_dispatch는 롤백 후 재배포처럼 코드 변경 없이 다시 돌려야 할 때 쓴다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 병합이 연달아 일어나도 배포가 겹치지 않게 직렬화한다.
# Pages 배포는 중간에 끊겨도 이전 배포가 그대로 남지만, 순서가 뒤집히면 옛 커밋이 이긴다.
concurrency:
  group: deploy-frontend-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      entry: ${{ steps.entry.outputs.entry }}

    steps:
      - uses: actions/checkout@v4

      # npm이 아니라 bun을 쓰는 이유는 ci.yml 주석 참고(package-lock.json이 깨져 있다).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # VITE_API_URL은 빌드 시점에 번들로 구워진다. 비어 있으면 axios baseURL이 undefined가
      # 되어 모든 API 호출이 qeploy.com(= 이제 Pages)으로 나가고 404 HTML이 돌아온다.
      - name: Resolve build-time API URL
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::저장소 변수 VITE_API_URL이 비어 있습니다. Settings > Secrets and variables > Actions > Variables 에 등록하세요."
            exit 1
          fi
          echo "빌드 대상 API: ${VITE_API_URL}"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bun run build

      # 빌드가 조용히 비어 나오는 경우와, 의도한 API URL이 번들에 실제로 박혔는지를 여기서 잡는다.
      - name: Verify build output
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html이 없습니다. 빌드가 산출물을 내지 못했습니다."
            exit 1
          fi
          if ! grep -rqF "${VITE_API_URL}" dist/assets/*.js; then
            echo "::error::번들에서 ${VITE_API_URL} 을 찾지 못했습니다. VITE_API_URL이 빌드에 반영되지 않았습니다."
            exit 1
          fi
          echo "산출물 크기: $(du -sh dist | cut -f1)"

      # Pages에는 서버 쪽 SPA fallback이 없다. 모르는 경로에는 404.html을 내주므로 index.html을
      # 그대로 복사해 두면 /home 같은 깊은 주소로 바로 들어와도 앱이 뜬다. 다만 상태 코드는 404다.
      #
      # 검색 수집 대상인 공개 페이지(public/sitemap.xml)는 404로 나가면 안 된다. Pages는
      # /template 요청에 template.html 을 내주므로 같은 파일을 그 이름으로도 둔다.
      - name: Add SPA fallback
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          cp dist/index.html dist/template.html

      # 배포 검증에서 쓸 진입 스크립트 경로. index.html만 맞고 asset이 없으면 화면은 백지가 된다.
      - name: Record entry asset
        id: entry
        run: |
          set -euo pipefail
          entry=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' dist/index.html | head -1)
          if [ -z "${entry}" ]; then
            echo "::error::index.html에서 asset 참조를 찾지 못했습니다."
            exit 1
          fi
          echo "entry=${entry}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy ${{ github.sha }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Pages 엣지(185.199.108.153)를 직접 때려 이번 산출물이 나가는지 본다. DNS를 거치지 않으므로
      # 도메인을 옮기는 도중에도, Cloudflare가 앞에 있어도 같은 것을 확인한다. 인증서가 아직
      # 발급 전일 수 있어 -k 를 쓴다 — 여기서 보는 것은 내용이지 인증서가 아니다.
      #
      # 배포 직후에는 엣지 캐시가 옛 index.html을 잠깐 내줄 수 있어 몇 번 다시 본다.
      - name: Verify deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ENTRY: ${{ needs.build.outputs.entry }}
        run: |
          set -euo pipefail
          host=$(echo "${PAGE_URL}" | sed -E 's#^https?://([^/]+).*#\1#')
          fetch() { curl -fsS -k --resolve "${host}:443:185.199.108.153" "https://${host}$1"; }

          for attempt in $(seq 1 12); do
            # curl | grep -q 는 grep이 먼저 끝나면 curl이 SIGPIPE로 실패해 pipefail에 걸린다. 받아 두고 본다
            body=$(fetch / || true)
            if grep -qF "${ENTRY}" <<< "${body}"; then
              fetch "${ENTRY}" > /dev/null
              template=$(fetch /template)
              grep -qF "${ENTRY}" <<< "${template}"
              echo "검증 통과: ${host} 가 ${ENTRY} 를 내준다"
              exit 0
            fi
            echo "아직 옛 index.html (${attempt}/12) — 10초 뒤 다시 본다"
            sleep 10
          done
          echo "::error::${host} 가 이번 배포의 index.html(${ENTRY})을 내주지 않습니다."
          exit 1
