<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>P2가 병목이자 인프라</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 428px; height: 148px;
    overflow: hidden;
    background: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .note {
    width: 428px; height: 148px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 18px 14px;
  }
  h3 {
    font-size: 15px;
    font-weight: 800;
    color: #1A46CD;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  p {
    font-size: 13.5px;
    font-weight: 600;
    color: #334155;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="note">
    <h3>P2가 병목이자 인프라</h3>
    <p>보행이 안 되면 점검도 가스 추적도 시작할 수 없습니다. Module 1은 단독 모듈이 아니라 Module 2·3의 전제라, 55시간을 가장 크게 배분했습니다.</p>
  </div>
</body>
</html>
