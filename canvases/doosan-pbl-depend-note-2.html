<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>P1에 브리지를 넣는 이유</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 428px; height: 148px;
    overflow: hidden;
    background: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .note {
    width: 428px; height: 148px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 18px 14px;
  }
  h3 {
    font-size: 15px;
    font-weight: 800;
    color: #1A46CD;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  p {
    font-size: 13.5px;
    font-weight: 600;
    color: #334155;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="note">
    <h3>P1에 브리지를 넣는 이유</h3>
    <p>Harmonic 센서는 그대로 ROS 2로 들어오지 않습니다. 브리지는 P1에서 붙여야 하고, P2로 미루면 높이맵 개발이 통째로 멈춥니다.</p>
  </div>
</body>
</html>
