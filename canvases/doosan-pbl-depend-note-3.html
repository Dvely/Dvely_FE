<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>P3 / P4는 병렬 가능</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 428px; height: 148px;
    overflow: hidden;
    background: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .note {
    width: 428px; height: 148px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 18px 14px;
  }
  h3 {
    font-size: 15px;
    font-weight: 800;
    color: #1A46CD;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  p {
    font-size: 13.5px;
    font-weight: 600;
    color: #334155;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="note">
    <h3>P3 / P4는 병렬 가능</h3>
    <p>가스 확산은 시뮬과 별도로 도는 노드라 점검 AI와 동시에 만들 수 있습니다. 다만 현장을 훑는 탐색은 로봇이 걸을 수 있어야 합니다.</p>
  </div>
</body>
</html>
