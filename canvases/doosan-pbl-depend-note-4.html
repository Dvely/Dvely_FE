<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>P5를 따로 뺀 이유</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 428px; height: 148px;
    overflow: hidden;
    background: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .note {
    width: 428px; height: 148px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 18px 14px;
  }
  h3 {
    font-size: 15px;
    font-weight: 800;
    color: #1A46CD;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  p {
    font-size: 13.5px;
    font-weight: 600;
    color: #334155;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="note">
    <h3>P5를 따로 뺀 이유</h3>
    <p>세 모듈을 나중에 한꺼번에 붙이면 데이터 병목과 시간 동기를 못 맞춥니다. 통신 규격은 P3 착수 때 초안을 확정하고, P5는 검증만 합니다.</p>
  </div>
</body>
</html>
