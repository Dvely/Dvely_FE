<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>문제 제기 — 발전소 자율 점검</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: #1a1a1a;
    display: flex;
  }
  .left {
    width: 980px;
    padding: 88px 64px 72px 80px;
    background: #fff;
    position: relative;
    z-index: 2;
  }
  .kicker {
    color: #2563eb;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.6px;
    margin-bottom: 52px;
  }
  .item { display: flex; gap: 22px; margin-bottom: 40px; align-items: flex-start; }
  .ico {
    width: 62px; height: 62px; min-width: 62px;
    border-radius: 50%;
    background: #2563eb;
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .item h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.3px; }
  .item p { font-size: 18px; color: #4b5563; line-height: 1.5; max-width: 720px; }
  .right {
    flex: 1;
    position: relative;
    background: #0b1f3a url("doosan-ppt-images/06-anymal-substation-inspection.jpg") center/cover no-repeat;
  }
  .right::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(15,40,80,0.25) 40%, rgba(15,40,80,0.35) 100%);
  }
  .glow {
    position: absolute;
    left: -180px; top: 210px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(96,165,250,0.55) 0%, rgba(59,130,246,0.18) 42%, transparent 70%);
    z-index: 3;
    pointer-events: none;
  }
  .ribbon {
    position: absolute;
    left: -8px; top: 0; bottom: 0;
    width: 268px;
    background: #1d4ed8;
    clip-path: polygon(0 0, 78% 0, 100% 100%, 0 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 28px 0 36px;
    z-index: 2;
  }
  .ribbon .sol {
    color: #fff;
    font-size: 34px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
  }
  .ribbon .sub {
    color: #dbeafe;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <section class="left">
    <div class="kicker">문제 제기</div>
    <h1>지금 발전소에서는<br/>이런 일이 벌어지고 있습니다</h1>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/></svg>
      </div>
      <div>
        <h2>사람이 들어가기 위험한 구역</h2>
        <p>고온 배관, 유독 가스, 좁은 철제 계단·미끄러운 바닥. 위험할수록 점검 주기는 짧아야 합니다.</p>
      </div>
    </div>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v16H7z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      </div>
      <div>
        <h2>아날로그 계기, 종이 기록</h2>
        <p>압력계는 디지털 통신이 안 됩니다. 눈과 손으로 읽고 적으니 데이터가 비정형·비실시간입니다.</p>
      </div>
    </div>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20c.8-3 3-5 5-5s4.2 2 5 5"/><path d="M13 20c.6-2.4 2.2-4 4-4s3.4 1.6 4 4"/></svg>
      </div>
      <div>
        <h2>이상 징후를 놓친다</h2>
        <p>사람이 못 가는 구역은 점검이 밀리고, 과열·누출을 조기에 잡지 못합니다.</p>
      </div>
    </div>
  </section>

  <div class="glow"></div>
  <section class="right">
    <div class="ribbon">
      <div class="sol">사람 대신<br/>4족 로봇 점검</div>
      <div class="sub">이 문제들,<br/>Digital Twin으로<br/>해결할 수 있습니다</div>
    </div>
  </section>
</body>
</html>
