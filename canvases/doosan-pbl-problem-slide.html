<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>과제 분석 — 우리가 해결해야 할 문제는 무엇인가?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: #1f2937;
    display: flex;
    position: relative;
  }
  .left {
    width: 1040px;
    padding: 72px 48px 64px 80px;
    background: #fff;
    position: relative;
    z-index: 2;
  }
  .kicker {
    color: #2563eb;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.32;
    letter-spacing: -0.7px;
    color: #1e3a5f;
    margin-bottom: 64px;
  }
  .item {
    display: flex;
    gap: 22px;
    margin-bottom: 42px;
    align-items: flex-start;
  }
  .ico {
    width: 64px; height: 62px; min-width: 64px;
    border-radius: 50%;
    background: #60a5fa;
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 28px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.3px; color: #1e3a5f; }
  .item p { font-size: 18px; color: #64748b; line-height: 1.5; max-width: 720px; }
  .arrow {
    position: absolute;
    right: -90px; top: 210px;
    width: 280px; height: 520px;
    background: linear-gradient(90deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 55%, rgba(255,255,255,0) 100%);
    clip-path: polygon(0 8%, 62% 0, 100% 50%, 62% 100%, 0 92%);
    z-index: 3;
    pointer-events: none;
  }
  .right {
    flex: 1;
    position: relative;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.55) 0%, rgba(30,74,180,0.28) 28%, rgba(26,70,205,0.42) 100%),
      url("doosan-ppt-images/06-anymal-substation-inspection.jpg") center/cover no-repeat;
  }
  .ribbon {
    position: absolute;
    left: 70px; top: 0; bottom: 0;
    width: 340px;
    background: #1A46CD;
    transform: skewX(-12deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 18px 0 0 rgba(15, 40, 80, 0.18);
    z-index: 2;
  }
  .ribbon-inner {
    transform: skewX(12deg);
    color: #fff;
    padding: 0 18px 0 8px;
    width: 280px;
  }
  .ribbon h2 {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -0.6px;
    margin-bottom: 18px;
  }
  .ribbon p {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.45;
    color: #dbeafe;
  }
</style>
</head>
<body>
  <section class="left">
    <div class="kicker">과제 분석</div>
    <h1>우리가 해결해야 할 문제는<br/>무엇인가?</h1>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 4h8l2 3v13H6V7l2-3z"/><path d="M8 4v3h8"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      <div>
        <h2>사람이 들어가기 위험한 구역</h2>
        <p>고온 배관, 유독 가스, 좁은 철제 계단·미끄러운 바닥. 위험할수록 점검 주기는 짧아야 합니다.</p>
      </div>
    </div>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2M7.2 7.2l1.4 1.4M15.4 15.4l1.4 1.4M7.2 16.8l1.4-1.4M15.4 8.6l1.4-1.4"/></svg>
      </div>
      <div>
        <h2>아날로그 계기, 종이 기록</h2>
        <p>압력계는 디지털 통신이 안 됩니다. 눈과 손으로 읽고 적으니 데이터가 비정형·비실시간입니다.</p>
      </div>
    </div>

    <div class="item">
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.6"/><circle cx="16" cy="8" r="2.6"/><path d="M3.5 20c.7-3 2.8-4.8 4.5-4.8S12 17 12.8 20"/><path d="M13.2 20c.6-2.4 2.1-4 3.8-4s3.2 1.6 3.8 4"/></svg>
      </div>
      <div>
        <h2>이상 징후를 놓친다</h2>
        <p>사람이 못 가는 구역은 점검이 밀리고, 과열·누출을 조기에 잡지 못합니다.</p>
      </div>
    </div>
  </section>

  <div class="arrow"></div>
  <section class="right">
    <div class="ribbon">
      <div class="ribbon-inner">
        <h2>사람 대신<br/>4족 로봇 점검</h2>
        <p>이 문제들,<br/>Digital Twin으로<br/>해결할 수 있습니다</p>
      </div>
    </div>
  </section>
</body>
</html>
