<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1120px; height: 480px; overflow: hidden; background: #ececef; }
body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.top { height: 44px; background: #fff; border-bottom: 1px solid #e2e2e8; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: #7c3aed; color: #fff; font: 800 13px/22px sans-serif; text-align: center; }
.brand { font-size: 14px; font-weight: 800; }
.proj { font-size: 12px; color: #888; border: 1px solid #ddd; border-radius: 6px; padding: 3px 10px; }
.body { display: flex; height: 436px; }
.side { width: 220px; background: #f7f7f9; border-right: 1px solid #e4e4ea; padding: 16px 14px; }
.side h4 { font-size: 12px; color: #999; margin-bottom: 10px; }
.side p { font-size: 12px; color: #bbb; line-height: 1.7; }
.main { flex: 1; display: flex; align-items: center; justify-content: center; }
.card {
  width: 520px; background: #fff; border-radius: 12px; padding: 28px 32px;
  box-shadow: 0 8px 28px rgba(0,0,0,.08); text-align: center;
}
.warn { width: 44px; height: 44px; border-radius: 50%; background: #fef3c7; color: #b45309; font: 800 22px/44px sans-serif; margin: 0 auto 12px; }
h2 { font-size: 18px; margin-bottom: 8px; }
.card p { font-size: 13px; color: #666; line-height: 1.55; }
.btns { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
.btns span { font-size: 12px; padding: 7px 14px; border-radius: 8px; }
.pri { background: #7c3aed; color: #fff; }
.sec { background: #f3f3f6; color: #444; }
</style></head>
<body>
<div class="top"><div class="logo">Q</div><div class="brand">Qeploy</div><div class="proj">프로젝트 없음</div></div>
<div class="body">
  <aside class="side">
    <h4>AI Workspace</h4>
    <p>세션이 없습니다.<br/>프로젝트를 연결해야<br/>대화를 시작할 수 있습니다.</p>
  </aside>
  <div class="main">
    <div class="card">
      <div class="warn">!</div>
      <h2>먼저 프로젝트를 생성해 주세요.</h2>
      <p>선택된 프로젝트가 없어 Decision Agent가 처리를 중단했습니다.<br/>빈 생성, ZIP 업로드, GitHub 레포 불러오기 중 하나로 시작한 뒤 다시 요청하세요.</p>
      <div class="btns"><span class="pri">프로젝트 생성</span><span class="sec">닫기</span></div>
    </div>
  </div>
</div>
</body></html>
