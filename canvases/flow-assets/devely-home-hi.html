<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1440px; height: 780px; overflow: hidden; background: #f8fafc; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #0f172a; display: flex; }
    aside {
      width: 76px; background: #ebebeb; border-right: 1px solid rgba(15,23,42,.08);
      display: flex; flex-direction: column; align-items: center; padding: 20px 0 16px; gap: 6px;
    }
    .ico {
      width: 36px; height: 36px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; color: #34322d;
    }
    .ico.on { background: #e4e4e4; }
    .sp { margin-top: auto; width: 36px; border-top: 1px solid rgba(15,23,42,.08); padding-top: 10px; }
    main { flex: 1; background: #fff; min-width: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .brand { font-size: 14px; font-weight: 800; }
    .hr { display: flex; align-items: center; gap: 8px; }
    .bell { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .av { width: 30px; height: 30px; border-radius: 15px; object-fit: cover; }
    .hero { display: flex; flex-direction: column; align-items: center; padding: 28px 24px 18px; }
    h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.3px; }
    .box {
      margin-top: 22px; width: 720px; border: 1px solid #e5e7eb; border-radius: 16px;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .ph { padding: 20px 20px 8px; font-size: 15px; color: #94a3b8; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 14px; }
    .l { display: flex; align-items: center; gap: 6px; }
    .sq { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; }
    .pj {
      height: 32px; border: 1px solid #e5e7eb; background: #f8fafc; border-radius: 8px;
      padding: 0 10px; font-size: 12px; font-weight: 600; color: #334155;
      display: flex; align-items: center; gap: 6px;
    }
    .send {
      width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .chips { margin-top: 16px; display: flex; gap: 8px; }
    .chip {
      border: 1px solid #e5e7eb; background: #fff; border-radius: 999px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; color: #334155;
      display: flex; align-items: center; gap: 6px;
    }
    .ex { padding: 0 24px 16px; }
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid #e5e7eb; }
    .tab { padding-bottom: 10px; font-size: 15px; font-weight: 600; color: #94a3b8; }
    .tab.on { color: #0f172a; box-shadow: inset 0 -2px 0 #0f172a; }
    .filt { margin-top: 14px; display: flex; gap: 8px; }
    .sel {
      height: 36px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
      padding: 0 28px 0 12px; font-size: 13px; font-weight: 600; color: #334155;
      display: flex; align-items: center;
    }
    .grid { margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .add {
      aspect-ratio: 16/10; border: 1px dashed #cbd5e1; border-radius: 16px; background: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #64748b;
    }
    .plus {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid #e2e8f0; background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .add span { font-size: 13px; font-weight: 600; }
    .card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; border-radius: 16px; border: 1px solid #e2e8f0; display: block; }
    .card p { margin-top: 8px; font-size: 20px; font-weight: 700; }
    .card s { display: block; margin-top: 2px; font-size: 13px; color: #64748b; text-decoration: none; }
  </style>
</head>
<body>
<aside>
  <div class="ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="5" height="12"/><rect x="10" y="3" width="5" height="12"/></svg></div>
  <div class="ico on"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8 L9 3 L15 8 V15 H3 Z"/></svg></div>
  <div class="ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="12" height="10"/><path d="M6 4 V3 H12 V4"/></svg></div>
  <div class="ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="5" height="5"/><rect x="10" y="3" width="5" height="5"/><rect x="3" y="10" width="5" height="5"/><rect x="10" y="10" width="5" height="5"/></svg></div>
  <div class="ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 14 L7 9 L10 12 L15 6"/><path d="M3 16 H15"/></svg></div>
  <div class="sp ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6 H14 M6 6 V15 H12 V6 M8 3 H10 V6"/></svg></div>
</aside>
<main>
  <header>
    <div class="brand">Devely 1.0 Lite</div>
    <div class="hr">
      <div class="bell"><svg width="18" height="18" fill="none" stroke="#0f172a" stroke-width="1.75"><path d="M4 13 H14 L13 8 A4.5 4.5 0 0 0 5 8 Z"/><path d="M8 15 A1.5 1.5 0 0 0 10 15"/></svg></div>
      <img class="av" src="file:///Users/kimtaewoo/Documents/GitHub/Dvely_FE/src/assets/icons/profile.svg" alt=""/>
    </div>
  </header>
  <section class="hero">
    <h1>무엇을 도와드릴까요?</h1>
    <div class="box">
      <div class="ph">작업을 할당하거나 무엇이든 질문하세요</div>
      <div class="bar">
        <div class="l">
          <div class="sq"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 4 V14 M4 9 H14"/></svg></div>
          <div class="sq"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6 H15 M5 12 H13"/><circle cx="11" cy="6" r="1.4" fill="currentColor"/><circle cx="7" cy="12" r="1.4" fill="currentColor"/></svg></div>
          <div class="pj"><svg width="14" height="14" fill="none" stroke="#64748b" stroke-width="1.75"><rect x="3" y="4" width="8" height="8"/><path d="M5 4 V3 H9 V4"/></svg>프로젝트 선택</div>
        </div>
        <div class="l">
          <div class="sq"><svg width="18" height="18" fill="none" stroke="#64748b" stroke-width="1.75"><path d="M9 3 V10"/><path d="M5 8 A4 4 0 0 0 13 8"/><path d="M4 13 H14"/></svg></div>
          <div class="send"><svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2"><path d="M9 13 V5 M5 8 L9 4 L13 8"/></svg></div>
        </div>
      </div>
    </div>
    <div class="chips">
      <div class="chip">💻 슬라이드 제작</div>
      <div class="chip">&lt;&gt; 웹사이트 구축</div>
      <div class="chip">🖥️ 데스크톱 앱 개발</div>
      <div class="chip">🎨 디자인</div>
    </div>
  </section>
  <section class="ex">
    <div class="tabs">
      <div class="tab on">탐색</div>
      <div class="tab">내 템플릿</div>
    </div>
    <div class="filt">
      <div class="sel">모든 스타일</div>
      <div class="sel">모든 테마</div>
      <div class="sel">정렬 기준: 인기순</div>
    </div>
    <div class="grid">
      <div class="add"><div class="plus"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 5 V15 M5 10 H15"/></svg></div><span>내 템플릿 추가</span></div>
      <div class="card">
        <img src="file:///Users/kimtaewoo/Documents/GitHub/Dvely_FE/src/assets/images/tasktemplate/container2.png" alt=""/>
        <p>압구정 현대</p>
        <s>#빌라 #풀빌라</s>
      </div>
      <div class="card">
        <img src="file:///Users/kimtaewoo/Documents/GitHub/Dvely_FE/src/assets/images/tasktemplate/container1.png" alt=""/>
        <p>개발자 포트폴리오</p>
        <s>#포트폴리오 #개발자</s>
      </div>
      <div class="card">
        <img src="file:///Users/kimtaewoo/Documents/GitHub/Dvely_FE/src/assets/images/tasktemplate/container3.png" alt=""/>
        <p>Crimson</p>
        <s>#랜딩페이지 #애니메이션</s>
      </div>
    </div>
  </section>
</main>
</body>
</html>
