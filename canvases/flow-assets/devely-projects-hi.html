<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1440px; height: 780px; overflow: hidden; background: #f8fafc; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #0f172a; display: flex; }
    aside {
      width: 76px; background: #ebebeb; border-right: 1px solid rgba(15,23,42,.08);
      display: flex; flex-direction: column; align-items: center; padding: 20px 0 16px; gap: 6px;
    }
    .ico { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #34322d; }
    .ico.on { background: #e4e4e4; }
    .sp { margin-top: auto; width: 36px; border-top: 1px solid rgba(15,23,42,.08); padding-top: 10px; }
    main { flex: 1; background: #fff; min-width: 0; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .brand { font-size: 14px; font-weight: 800; }
    .hr { display: flex; align-items: center; gap: 8px; }
    .bell { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
    .av { width: 30px; height: 30px; border-radius: 15px; background: #e2e8f0; }
    .bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 28px 16px; }
    .tog { display: flex; border: 1px solid #e5e7eb; background: #f8fafc; border-radius: 8px; padding: 2px; }
    .tog b, .tog i { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-style: normal; }
    .tog b { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .tog i { color: #94a3b8; }
    .sel {
      height: 36px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
      padding: 0 28px 0 12px; font-size: 13px; font-weight: 600; color: #334155;
      display: flex; align-items: center;
    }
    .create {
      height: 36px; border-radius: 8px; background: #7c3aed; color: #fff;
      padding: 0 14px; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .grid { padding: 0 28px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; overflow: hidden; }
    .prev { padding: 12px 12px 12px; background: linear-gradient(#f8fafc, #fff); }
    .win { border: 1px solid #e9d5ff; border-radius: 6px; overflow: hidden; background: #fff; }
    .chrome { height: 26px; display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-bottom: 1px solid #e5e7eb; padding: 0 8px; }
    .dots { display: flex; gap: 4px; }
    .dots span { width: 6px; height: 6px; border-radius: 3px; }
    .url { flex: 1; min-width: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 3px; padding: 3px 6px; font-size: 9px; color: #94a3b8; }
    .empty {
      min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #faf5ff, #f5f3ff, #ede9fe);
    }
    .empty .c {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.8);
      color: #7c3aed; display: flex; align-items: center; justify-content: center;
    }
    .empty p { font-size: 10px; font-weight: 600; color: #64748b; }
    .meta { padding: 16px 20px 14px; }
    .tags { display: flex; gap: 6px; }
    .y { background: #fef9c3; color: #854d0e; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .g { background: #f1f5f9; color: #64748b; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .meta h3 { margin-top: 10px; font-size: 15px; font-weight: 800; }
    .meta p { margin-top: 4px; font-size: 13px; color: #94a3b8; }
    .foot { border-top: 1px solid #f1f5f9; padding: 14px 24px; text-align: right; font-size: 12px; color: #94a3b8; }
  </style>
</head>
