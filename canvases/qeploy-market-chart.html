<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>글로벌 AI 웹사이트 빌더 시장</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 620px;
        background: #fff;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Arial, sans-serif;
        color: #2a1240;
      }
      .chart {
        width: 1280px;
        height: 620px;
        padding: 28px 36px 24px 20px;
        display: flex;
        flex-direction: column;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #3b1e54;
        letter-spacing: -0.3px;
        margin: 0 0 8px 52px;
      }
      .plot-wrap {
        flex: 1;
        display: grid;
        grid-template-columns: 52px 28px 1fr;
        min-height: 0;
      }
      .y-label {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #6b7280;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        letter-spacing: 0.2px;
      }
      .y-ticks {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        padding: 6px 8px 36px 0;
        font-size: 13px;
        color: #6b7280;
      }
      .plot {
        position: relative;
        border-bottom: 1px solid #d1d5db;
        margin-bottom: 36px;
      }
      .gridline {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid #e5e7eb;
      }
      .bars {
        position: absolute;
        inset: 0 12px 0 8px;
        display: flex;
        align-items: flex-end;
        justify-content: space-around;
      }
      .col {
        position: relative;
        width: 56px;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .bar {
        width: 48px;
        background: #3b1e54;
      }
      .year {
        position: absolute;
        left: 50%;
        bottom: -28px;
        transform: translateX(-50%);
        font-size: 14px;
        color: #4b5563;
      }
      .tooltip {
        position: absolute;
        left: 50%;
        bottom: calc(35.1% + 18px);
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        padding: 8px 12px 9px;
        white-space: nowrap;
        z-index: 2;
      }
      .tooltip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        transform: translateX(-50%);
        border-width: 7px 7px 0 7px;
        border-style: solid;
        border-color: #fff transparent transparent transparent;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
      }
      .tooltip .year-h {
        font-size: 15px;
        font-weight: 800;
        color: #111827;
        margin-bottom: 4px;
      }
      .tooltip .row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: #374151;
      }
      .swatch {
        width: 10px;
        height: 10px;
        background: #3b1e54;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="chart">
      <h1>글로벌 AI 웹사이트 빌더 시장, 2024-2030년(백만 달러)</h1>
      <div class="plot-wrap">
        <div class="y-label">Market Size (US$M)</div>
        <div class="y-ticks">
          <span>10.0K</span>
          <span>8.0K</span>
          <span>6.0K</span>
          <span>4.0K</span>
          <span>2.0K</span>
          <span>0</span>
        </div>
        <div class="plot">
          <div class="gridline" style="top: 0%"></div>
          <div class="gridline" style="top: 20%"></div>
          <div class="gridline" style="top: 40%"></div>
          <div class="gridline" style="top: 60%"></div>
          <div class="gridline" style="top: 80%"></div>
          <div class="bars">
            <div class="col">
              <div class="bar" style="height: 29.3%"></div>
              <span class="year">2024</span>
            </div>
            <div class="col">
              <div class="tooltip">
                <div class="year-h">2025</div>
                <div class="row"><span class="swatch"></span>전체 : $3,510.0</div>
              </div>
              <div class="bar" style="height: 35.1%"></div>
              <span class="year">2025</span>
            </div>
            <div class="col">
              <div class="bar" style="height: 41.9%"></div>
              <span class="year">2026</span>
            </div>
            <div class="col">
              <div class="bar" style="height: 50.2%"></div>
              <span class="year">2027</span>
            </div>
            <div class="col">
              <div class="bar" style="height: 60.2%"></div>
              <span class="year">2028</span>
            </div>
            <div class="col">
              <div class="bar" style="height: 72.2%"></div>
              <span class="year">2029</span>
            </div>
            <div class="col">
              <div class="bar" style="height: 86.6%"></div>
              <span class="year">2030</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
