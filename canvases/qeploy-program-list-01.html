<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/><title>Qeploy 프로그램 목록 01</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, .page { width: 1200px; height: 600px; background: #fff; overflow: hidden; }
body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #111; }
.page { padding: 28px 28px 22px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td {
  border: 1px solid #b4b4b4;
  font-size: 13.5px;
  height: 40px;
}
th {
  background: #c5d8ea;
  font-weight: 700;
  text-align: center;
}
td.cat, td.num { text-align: center; font-weight: 700; vertical-align: middle; }
td.name { padding: 0 14px; text-align: left; font-weight: 600; }
td.omit { text-align: center; color: #555; font-weight: 700; }
</style></head>
<body>
<section class="page">
  <table>
    <colgroup>
      <col style="width:18%"/><col style="width:22%"/><col/>
    </colgroup>
    <thead>
      <tr>
        <th>기능 분류</th>
        <th>기능번호</th>
        <th>기능 명</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="cat" rowspan="3">HOM</td>
        <td class="num">HOM-01-01</td>
        <td class="name">홈</td>
      </tr>
      <tr>
        <td class="num">HOM-01-02</td>
        <td class="name">홈-프로젝트 선택</td>
      </tr>
      <tr>
        <td class="num">HOM-01-03</td>
        <td class="name">홈-템플릿 탐색</td>
      </tr>
      <tr>
        <td class="cat" rowspan="3">LOG</td>
        <td class="num">LOG-01-01</td>
        <td class="name">GitHub 로그인</td>
      </tr>
      <tr>
        <td class="num">LOG-01-02</td>
        <td class="name">권한 요청</td>
      </tr>
      <tr>
        <td class="num">LOG-01-03</td>
        <td class="name">레포 연결·생성·해제</td>
      </tr>
      <tr>
        <td class="cat" rowspan="6">PRJ</td>
        <td class="num">PRJ-01</td>
        <td class="name">프로젝트 목록</td>
      </tr>
      <tr>
        <td class="num">PRJ-02</td>
        <td class="name">새 프로젝트 생성</td>
      </tr>
      <tr>
        <td class="num">PRJ-02-01</td>
        <td class="name">새 프로젝트-빈 프로젝트 생성</td>
      </tr>
      <tr>
        <td class="num">PRJ-02-02</td>
        <td class="name">새 프로젝트-ZIP 업로드</td>
      </tr>
      <tr>
        <td class="num">PRJ-02-03</td>
        <td class="name">새 프로젝트-GitHub 레포 불러오기</td>
      </tr>
      <tr>
        <td class="num">PRJ-03</td>
        <td class="name">Overview 대시보드</td>
      </tr>
    </tbody>
  </table>
</section>
</body></html>
