<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>개선 희망점</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 800px; height: 600px; overflow: hidden; background: #fff;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        color: #222;
      }
      .wrap {
        width: 800px; height: 600px;
        position: relative;
      }
      .donut {
        position: absolute;
        left: 248px; top: 150px;
        width: 280px; height: 280px;
        border-radius: 50%;
        background: conic-gradient(
          #5b9bd5 0 31.69%,
          #ed7d31 31.69% 53.52%,
          #a6a6a6 53.52% 69.72%,
          #ffc000 69.72% 81.69%,
          #9dc3e6 81.69% 90.14%,
          #70ad47 90.14% 95.77%,
          #2f5597 95.77% 98.59%,
          #c9c9c9 98.59% 100%
        );
      }
      .hole {
        position: absolute;
        left: 318px; top: 220px;
        width: 140px; height: 140px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
      }
      .box {
        position: absolute;
        border: 1px solid #888;
        background: #fff;
        padding: 3px 6px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .vt {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      svg.lines {
        position: absolute;
        inset: 0;
        width: 800px;
        height: 600px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="donut"></div>
      <div class="hole">없음<br />1.41%</div>
      <svg class="lines">
        <g stroke="#777" stroke-width="1" fill="none">
          <polyline points="388,160 430,108 460,108"/>
          <polyline points="510,250 590,218 610,218"/>
          <polyline points="500,380 560,380 580,380"/>
          <polyline points="390,420 430,490 450,490"/>
          <polyline points="290,420 240,500 220,500"/>
          <polyline points="255,360 170,380 150,380"/>
          <polyline points="265,210 170,165 150,165"/>
        </g>
      </svg>
      <div class="box" style="left:460px;top:96px">자연어로 생성·배포 31.69%</div>
      <div class="box" style="left:610px;top:204px">실제 동작 미리보기 21.83%</div>
      <div class="box" style="left:580px;top:366px">승인 후 안전한 배포 16.20%</div>
      <div class="box" style="left:450px;top:478px">도메인 연결 자동화 11.97%</div>
      <div class="box" style="left:8px;top:488px">GitHub 버전관리 자동화 8.45%</div>
      <div class="box" style="left:8px;top:366px">예상 요금 확인 5.63%</div>
      <div class="box" style="left:8px;top:152px">인프라 운영 자동화 2.82%</div>
      <div class="vt">개선 희망점</div>
    </div>
  </body>
</html>
