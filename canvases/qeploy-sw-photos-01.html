<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>참조 — S/W 기능 실사 사진</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, .page {
  width: 1920px;
  height: 1080px;
  background: #fff;
  overflow: hidden;
}
body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #111; }
.page {
  display: grid;
  grid-template-rows: auto 1fr;
}
.banner {
  background: #1e4a7a;
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  padding: 16px 40px;
}
.body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  padding: 24px 40px 28px;
  min-height: 0;
}
.col {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 12px;
  min-height: 0;
}
.shot {
  min-height: 0;
  background: #f4f5f7;
  border: 1px solid #d0d0d0;
}
.shot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top center;
  display: block;
}
.name {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}
.point {
  font-size: 16px;
  color: #333;
  line-height: 1.4;
  word-break: keep-all;
}
.point b { color: #1e4a7a; }
</style>
</head>
<body>
<section class="page">
  <div class="banner">참조 — S/W 기능 실사 사진</div>
  <div class="body">
    <div class="col">
      <div class="shot">
        <img src="flow-assets/devely-projects-screen.png" alt="프로젝트 목록"/>
      </div>
      <div>
        <p class="name">프로젝트 목록</p>
        <p class="point"><b>검수 포인트</b> · 프로젝트 카드, 템플릿 선택, 최근 작업 진입</p>
      </div>
    </div>
    <div class="col">
      <div class="shot">
        <img src="flow-assets/devely-home-screen.png" alt="프로젝트 선택"/>
      </div>
      <div>
        <p class="name">프로젝트 선택</p>
        <p class="point"><b>검수 포인트</b> · 서비스 시작과 프로젝트 Overview 진입 흐름</p>
      </div>
    </div>
  </div>
</section>
</body>
</html>
