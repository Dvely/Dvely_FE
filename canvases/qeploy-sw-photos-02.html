<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>실사 사진 — 프로젝트 선택</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, .page {
  width: 1920px; height: 1080px; background: #fff; overflow: hidden;
}
body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #111; }
.page {
  display: grid;
  grid-template-columns: 1.38fr 0.62fr;
  gap: 40px;
  padding: 48px 48px 48px 52px;
}
.shot {
  min-height: 0;
  background: #f4f5f7;
  border: 1px solid #d8d8d8;
  display: flex;
  align-items: stretch;
  justify-content: center;
}
.shot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: top center;
  display: block;
}
.side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  padding: 8px 8px 8px 0;
}
.kicker {
  font-size: 15px;
  font-weight: 700;
  color: #1e4a7a;
  letter-spacing: 0.4px;
  margin-bottom: 14px;
}
h1 {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.8px;
  margin-bottom: 36px;
  line-height: 1.25;
}
.label {
  font-size: 15px;
  font-weight: 800;
  color: #1e4a7a;
  margin-bottom: 16px;
}
ul { list-style: none; }
li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 22px;
  font-weight: 600;
  line-height: 1.45;
  margin-bottom: 16px;
  word-break: keep-all;
}
.dot {
  flex: 0 0 12px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #1e4a7a;
  margin-top: 10px;
}
</style>
</head>
<body>
<section class="page">
  <div class="shot">
    <img src="flow-assets/devely-home-screen.png" alt="프로젝트 선택"/>
  </div>
  <div class="side">
    <p class="kicker">참조 · S/W 기능 실사 사진</p>
    <h1>프로젝트 선택</h1>
    <p class="label">검수 포인트</p>
    <ul>
      <li><span class="dot"></span>서비스 시작</li>
      <li><span class="dot"></span>프로젝트 Overview 진입 흐름</li>
    </ul>
  </div>
</section>
</body>
</html>
