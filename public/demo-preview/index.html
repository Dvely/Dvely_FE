<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 할 일</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --ink: #14161f;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #4f46e5;
    --brand-ink: #ffffff;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 460px; margin: 0 auto; padding: 40px 20px 64px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 28px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--brand); color: var(--brand-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px;
    box-shadow: 0 1px 2px rgba(20,22,31,.04);
  }
  h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14.5px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .field + .field { margin-top: 14px; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
    border: none; border-radius: 9px; padding: 11px 14px;
    background: var(--brand); color: var(--brand-ink); width: 100%;
  }
  button:hover { background: #4338ca; }
  .switch { margin: 16px 0 0; text-align: center; font-size: 13.5px; color: var(--muted); }
  .switch a { color: var(--brand); font-weight: 600; text-decoration: none; cursor: pointer; }
  .error { color: var(--danger); font-size: 13px; margin: 12px 0 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .who { font-size: 13.5px; color: var(--muted); }
  .who b { color: var(--ink); font-weight: 600; }
  .ghost {
    width: auto; background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 11px; font-size: 12.5px; font-weight: 500;
  }
  .ghost:hover { background: #f3f4f6; color: var(--ink); }
  .composer { display: flex; gap: 8px; margin-bottom: 18px; }
  .composer input { flex: 1; }
  .composer button { width: auto; padding: 10px 16px; white-space: nowrap; }
  ul.todos { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
  ul.todos li {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 4px; border-bottom: 1px solid var(--line);
  }
  ul.todos li:last-child { border-bottom: none; }
  ul.todos input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--brand); cursor: pointer; flex: none; }
  .todo-text { flex: 1; font-size: 14.5px; }
  .done .todo-text { color: var(--muted); text-decoration: line-through; }
  .remove {
    width: auto; background: none; color: #9ca3af; font-size: 17px;
    padding: 0 4px; line-height: 1; font-weight: 400;
  }
  .remove:hover { background: none; color: var(--danger); }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 28px 0; }
  .count { font-size: 12.5px; color: var(--muted); margin-top: 16px; text-align: right; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <span class="mark">할</span>
    <h1>함께 할 일</h1>
  </div>

  <!-- 회원가입 / 로그인 -->
  <div class="card" id="auth">
    <h2 id="authTitle">회원가입</h2>
    <p class="sub" id="authSub">이메일과 비밀번호로 계정을 만드세요.</p>
    <form id="authForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="8자 이상" required>
      </div>
      <p class="error" id="authError" hidden></p>
      <div class="field">
        <button type="submit" id="authSubmit">가입하기</button>
      </div>
    </form>
    <p class="switch" id="authSwitch">이미 계정이 있으신가요? <a id="switchLink">로그인</a></p>
  </div>

  <!-- 할 일 목록 -->
  <div id="app" hidden>
    <div class="topbar">
      <span class="who"><b id="whoEmail"></b> 님</span>
      <button class="ghost" id="logout" type="button">로그아웃</button>
    </div>
    <div class="card">
      <form class="composer" id="addForm">
        <input id="newTodo" placeholder="할 일을 입력하세요" autocomplete="off" required>
        <button type="submit">추가</button>
      </form>
      <ul class="todos" id="list"></ul>
      <p class="empty" id="empty">아직 할 일이 없습니다.</p>
      <p class="count" id="count"></p>
    </div>
  </div>
</div>

<script>
(function () {
  var USERS = 'demo-app-users';
  var SESSION = 'demo-app-session';
  var TODOS = 'demo-app-todos';

  function read(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장이 막힌 환경 */ }
  }

  var mode = 'signup';
  var authEl = document.getElementById('auth');
  var appEl = document.getElementById('app');
  var errorEl = document.getElementById('authError');

  function setMode(next) {
    mode = next;
    var signup = mode === 'signup';
    document.getElementById('authTitle').textContent = signup ? '회원가입' : '로그인';
    document.getElementById('authSub').textContent = signup
      ? '이메일과 비밀번호로 계정을 만드세요.'
      : '가입한 계정으로 로그인하세요.';
    document.getElementById('authSubmit').textContent = signup ? '가입하기' : '로그인';
    document.getElementById('authSwitch').innerHTML = signup
      ? '이미 계정이 있으신가요? <a id="switchLink">로그인</a>'
      : '계정이 없으신가요? <a id="switchLink">회원가입</a>';
    document.getElementById('switchLink').onclick = function () {
      setMode(signup ? 'login' : 'signup');
    };
    errorEl.hidden = true;
  }

  function fail(message) {
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  function currentEmail() {
    return read(SESSION, null);
  }

  function render() {
    var email = currentEmail();
    if (!email) {
      authEl.hidden = false;
      appEl.hidden = true;
      return;
    }
    authEl.hidden = true;
    appEl.hidden = false;
    document.getElementById('whoEmail').textContent = email;

    var all = read(TODOS, {});
    var mine = all[email] || [];
    var list = document.getElementById('list');
    list.innerHTML = '';

    mine.forEach(function (todo, index) {
      var li = document.createElement('li');
      if (todo.done) li.className = 'done';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = todo.done;
      box.onchange = function () {
        mine[index].done = box.checked;
        all[email] = mine;
        write(TODOS, all);
        render();
      };

      var span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.textContent = '×';
      remove.setAttribute('aria-label', '삭제');
      remove.onclick = function () {
        mine.splice(index, 1);
        all[email] = mine;
        write(TODOS, all);
        render();
      };

      li.appendChild(box);
      li.appendChild(span);
      li.appendChild(remove);
      list.appendChild(li);
    });

    document.getElementById('empty').hidden = mine.length > 0;
    var left = mine.filter(function (todo) { return !todo.done; }).length;
    document.getElementById('count').textContent = mine.length ? left + '개 남음 · 전체 ' + mine.length + '개' : '';
  }

  document.getElementById('authForm').onsubmit = function (event) {
    event.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var users = read(USERS, {});

    if (mode === 'signup') {
      if (password.length < 8) return fail('비밀번호는 8자 이상이어야 합니다.');
      if (users[email]) return fail('이미 가입된 이메일입니다. 로그인해 주세요.');
      users[email] = password;
      write(USERS, users);
    } else {
      if (!users[email]) return fail('가입되지 않은 이메일입니다.');
      if (users[email] !== password) return fail('비밀번호가 맞지 않습니다.');
    }

    write(SESSION, email);
    document.getElementById('password').value = '';
    errorEl.hidden = true;
    render();
  };

  document.getElementById('addForm').onsubmit = function (event) {
    event.preventDefault();
    var field = document.getElementById('newTodo');
    var text = field.value.trim();
    if (!text) return;

    var email = currentEmail();
    var all = read(TODOS, {});
    var mine = all[email] || [];
    mine.unshift({ text: text, done: false });
    all[email] = mine;
    write(TODOS, all);
    field.value = '';
    render();
  };

  document.getElementById('logout').onclick = function () {
    write(SESSION, null);
    setMode('login');
    render();
  };

  setMode(currentEmail() ? 'login' : 'signup');
  render();
})();
</script>
</body>
</html>
