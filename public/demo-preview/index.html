<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 할 일</title>
<!--
  시연 프리뷰: 에이전트가 만든 "함께 할 일" 앱.

  채팅에서 요청한 대로 회원가입·로그인, 마감일·우선순위·카테고리가 있는 할 일 카드,
  진행률과 카테고리 필터, 남색 카드형 테마를 갖췄다. 회원가입·로그인·추가·완료·삭제가
  실제로 동작한다(저장은 이 브라우저의 localStorage).

  자동 재생이 아래 id 로 이 앱을 조작한다 — 바꾸면 director.ts 도 같이 고친다.
  #email #password #authSubmit #newTodo #addForm(첫 버튼이 추가) · "로그아웃" · "503"
-->
<style>
  :root {
    --bg: #f2f4f9;
    --surface: #ffffff;
    --ink: #17203a;
    --muted: #69738f;
    --faint: #9aa3bb;
    --line: #e3e7f0;
    --navy: #1f2f5c;
    --navy-2: #2b4180;
    --navy-soft: #e8ecf7;
    --danger: #d64545;
    --ok: #1f9d6b;
    --work: #3557c7;   --work-bg: #e9eefc;
    --life: #1f8a64;   --life-bg: #e4f5ee;
    --study: #b5651d;  --study-bg: #fbefe2;
    --high: #e5484d; --mid: #f0a020; --low: #a5adc2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* 상단 */
  .bar {
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
  }
  .bar-inner {
    max-width: 720px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 10px;
  }
  .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: rgba(255,255,255,0.14); display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
  }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .bar .spacer { flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    background: rgba(255,255,255,0.12);
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: #ff8a8a; }
  .badge.up i { background: #5ee6a8; }
  .who { font-size: 12.5px; opacity: 0.86; }
  .ghost {
    border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff;
    border-radius: 8px; padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .shell { max-width: 720px; margin: 0 auto; padding: 22px 24px 48px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(23,32,58,0.04), 0 8px 24px rgba(23,32,58,0.05);
  }

  /* 회원가입 / 로그인 */
  .auth { max-width: 400px; margin: 18px auto 0; padding: 26px 26px 22px; }
  .auth h2 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  .auth .sub { margin: 4px 0 18px; color: var(--muted); font-size: 13px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #3c4664; margin-bottom: 5px; }
  .field input {
    width: 100%; height: 42px; padding: 0 13px; border-radius: 10px;
    border: 1px solid var(--line); background: #fbfcfe; outline: none;
  }
  .field input:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(43,65,128,0.14); background: #fff; }
  .primary {
    width: 100%; height: 44px; border: 0; border-radius: 11px; cursor: pointer;
    background: var(--navy); color: #fff; font-weight: 800; font-size: 14px;
  }
  .primary:hover { background: var(--navy-2); }
  .error { color: var(--danger); font-size: 12.5px; margin: 0 0 10px; }
  .apifail {
    border: 1px solid #f5c2c2; background: #fff4f4; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; color: #8f2a2a;
  }
  .apifail b { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .switch { text-align: center; color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
  .switch a { color: var(--navy-2); font-weight: 700; cursor: pointer; }
  .perks { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .perks span {
    font-size: 11.5px; font-weight: 700; color: var(--navy-2); background: var(--navy-soft);
    border-radius: 999px; padding: 4px 10px;
  }

  /* 진행률 */
  .summary { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
  .stat { padding: 14px 16px; }
  .stat .label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .stat .value { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
  .stat .value small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .progress { height: 8px; border-radius: 999px; background: var(--navy-soft); overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--navy-2), #5b7be0); transition: width 400ms ease; }
  .stat.due .value { color: var(--danger); }

  /* 필터 */
  .filters { display: flex; gap: 6px; margin: 16px 0 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: #4a5473; cursor: pointer;
  }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip em { font-style: normal; opacity: 0.7; margin-left: 4px; font-weight: 600; }

  /* 추가 */
  .composer { display: flex; gap: 8px; padding: 10px; align-items: center; }
  .composer input {
    flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fbfcfe; outline: none;
  }
  .composer input:focus { border-color: var(--navy-2); background: #fff; }
  .composer select {
    height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
    padding: 0 8px; font-size: 12.5px; font-weight: 700; color: #3c4664;
  }
  .composer button {
    height: 40px; padding: 0 16px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--navy); color: #fff; font-weight: 800;
  }

  .note {
    margin: 10px 0 0; font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .note button { border: 0; background: none; color: var(--navy-2); font-weight: 700; cursor: pointer; font-size: 12px; }

  /* 목록 */
  .todos { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .todo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .todo.fresh { animation: pop 420ms cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c8cfe0; background: #fff;
    flex: none; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .todo.done .check { background: var(--ok); border-color: var(--ok); }
  .check svg { width: 12px; height: 12px; opacity: 0; }
  .todo.done .check svg { opacity: 1; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 14px; }
  .todo.done .title { color: var(--faint); text-decoration: line-through; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .tag { border-radius: 6px; padding: 2px 7px; font-weight: 800; font-size: 11px; }
  .tag.work { color: var(--work); background: var(--work-bg); }
  .tag.life { color: var(--life); background: var(--life-bg); }
  .tag.study { color: var(--study); background: var(--study-bg); }
  .prio { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .prio i { width: 7px; height: 7px; border-radius: 50%; }
  .prio.high i { background: var(--high); } .prio.mid i { background: var(--mid); } .prio.low i { background: var(--low); }
  .due { font-weight: 700; }
  .due.today { color: var(--danger); }
  .remove { border: 0; background: none; color: #b8bfd0; font-size: 18px; cursor: pointer; padding: 0 4px; }
  .remove:hover { color: var(--danger); }

  .empty { text-align: center; padding: 30px 16px 26px; color: var(--muted); }
  .empty svg { width: 132px; height: auto; display: block; margin: 0 auto 10px; }
  .empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="mark">할</span>
    <h1>함께 할 일</h1>
    <span class="spacer"></span>
    <span class="who" id="who" hidden><b id="whoEmail"></b> 님</span>
    <span class="badge" id="apiBadge"><i></i><span id="apiBadgeText">API 연결 안 됨</span></span>
    <button class="ghost" id="logout" type="button" hidden>로그아웃</button>
  </div>
</header>

<main class="shell">
  <!-- 회원가입 / 로그인 -->
  <section class="card auth" id="auth">
    <h2 id="authTitle">회원가입</h2>
    <p class="sub" id="authSub">팀과 나눌 할 일을 이메일 하나로 시작하세요.</p>
    <form id="authForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="8자 이상" required>
      </div>
      <p class="error" id="authError" hidden></p>
      <div class="apifail" id="apiFail" hidden>
        <b>POST /api/auth/signup — 503</b>
        <span>서버에 연결할 수 없습니다. 백엔드가 아직 없습니다.</span>
      </div>
      <button type="submit" class="primary" id="authSubmit">가입하기</button>
    </form>
    <p class="switch" id="authSwitch">이미 계정이 있으신가요? <a id="switchLink">로그인</a></p>
    <div class="perks"><span>마감일</span><span>우선순위</span><span>카테고리</span><span>진행률</span></div>
  </section>

  <!-- 할 일 -->
  <section id="app" hidden>
    <div class="summary">
      <div class="card stat">
        <div class="label">진행률</div>
        <div class="value" id="pct">0%<small id="pctSub"></small></div>
        <div class="progress"><div id="bar" style="width:0%"></div></div>
      </div>
      <div class="card stat due">
        <div class="label">오늘 마감</div>
        <div class="value" id="dueToday">0</div>
      </div>
      <div class="card stat">
        <div class="label">높은 우선순위</div>
        <div class="value" id="highCount">0</div>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <form class="card composer" id="addForm">
      <input id="newTodo" placeholder="할 일을 입력하세요" autocomplete="off" required>
      <select id="newCategory" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="life">개인</option>
        <option value="study">공부</option>
      </select>
      <select id="newPriority" aria-label="우선순위">
        <option value="mid">보통</option>
        <option value="high">높음</option>
        <option value="low">낮음</option>
      </select>
      <select id="newDue" aria-label="마감일">
        <option value="0">오늘</option>
        <option value="1">내일</option>
        <option value="5">이번 주</option>
        <option value="">없음</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <p class="note" id="sampleNote" hidden>
      <span>처음 쓰시는 분을 위해 예시 할 일 3개를 넣어 두었습니다. 지우거나 바꿔 보세요.</span>
      <button type="button" id="dismissNote">닫기</button>
    </p>

    <ul class="todos" id="list"></ul>

    <div class="card empty" id="empty" hidden>
      <svg viewBox="0 0 160 120" aria-hidden="true">
        <rect x="34" y="14" width="92" height="98" rx="14" fill="#e8ecf7"/>
        <rect x="58" y="6" width="44" height="18" rx="8" fill="#2b4180"/>
        <rect x="50" y="42" width="60" height="8" rx="4" fill="#c7d0e8"/>
        <rect x="50" y="60" width="44" height="8" rx="4" fill="#c7d0e8"/>
        <rect x="50" y="78" width="52" height="8" rx="4" fill="#c7d0e8"/>
        <circle cx="122" cy="92" r="20" fill="#1f9d6b"/>
        <path d="M112 92l7 7 13-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>할 일이 비어 있습니다</b>
      위에서 첫 할 일을 추가해 팀과 나눠 보세요.
    </div>
  </section>
</main>

<script>
(function () {
  /*
    백엔드가 붙었는지는 부모 창이 localStorage 에 남긴다.

    프리뷰는 같은 오리진의 iframe 이라 저장소를 공유한다. 이 값 하나로 회원가입이
    실패하는 화면과 성공하는 화면이 갈린다 — 인프라를 붙이기 전과 후를 말이 아니라
    동작으로 보여주는 유일한 방법이다.
  */
  var BACKEND_READY = 'demo-backend-ready';
  var USERS = 'demo-app-users';
  var SESSION = 'demo-app-session';
  var TODOS = 'demo-app-todos';
  var DAY = 24 * 60 * 60 * 1000;

  var CATEGORY = { work: '업무', life: '개인', study: '공부' };
  var PRIORITY = { high: '높음', mid: '보통', low: '낮음' };

  function read(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장이 막힌 환경 */ }
  }
  function backendReady() {
    try { return localStorage.getItem(BACKEND_READY) === '1'; }
    catch (e) { return false; }
  }
  function startOfToday() {
    var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
  }
  function dueIn(days) {
    return days === '' || days == null ? null : startOfToday() + Number(days) * DAY;
  }
  function dueLabel(due) {
    if (due == null) return null;
    var days = Math.round((due - startOfToday()) / DAY);
    if (days < 0) return { text: '기한 지남', today: true };
    if (days === 0) return { text: '오늘 마감', today: true };
    if (days === 1) return { text: '내일', today: false };
    return { text: 'D-' + days, today: false };
  }

  /* 처음 가입한 사람에게 넣어 주는 예시. 지우면 그만이다 */
  function sampleTodos() {
    return [
      { id: 's1', text: '주간 회의 안건 정리', category: 'work', priority: 'high', due: dueIn(0), done: false },
      { id: 's2', text: '디자인 리뷰 피드백 반영', category: 'work', priority: 'mid', due: dueIn(1), done: false },
      { id: 's3', text: '알고리즘 문제 2개 풀기', category: 'study', priority: 'low', due: dueIn(5), done: true },
    ];
  }

  var mode = 'signup';
  var filter = 'all';
  var freshId = null;
  var authEl = document.getElementById('auth');
  var appEl = document.getElementById('app');
  var errorEl = document.getElementById('authError');

  function setMode(next) {
    mode = next;
    var signup = mode === 'signup';
    document.getElementById('authTitle').textContent = signup ? '회원가입' : '로그인';
    document.getElementById('authSub').textContent = signup
      ? '팀과 나눌 할 일을 이메일 하나로 시작하세요.'
      : '가입한 계정으로 로그인하세요.';
    document.getElementById('authSubmit').textContent = signup ? '가입하기' : '로그인';
    document.getElementById('authSwitch').innerHTML = signup
      ? '이미 계정이 있으신가요? <a id="switchLink">로그인</a>'
      : '계정이 없으신가요? <a id="switchLink">회원가입</a>';
    document.getElementById('switchLink').onclick = function () {
      setMode(signup ? 'login' : 'signup');
    };
    errorEl.hidden = true;
  }

  function fail(message) {
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  function currentEmail() { return read(SESSION, null); }
  function myTodos() { return read(TODOS, {})[currentEmail()] || []; }
  function saveMine(mine) {
    var all = read(TODOS, {});
    all[currentEmail()] = mine;
    write(TODOS, all);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function renderFilters(mine) {
    var box = document.getElementById('filters');
    box.innerHTML = '';
    [['all', '전체'], ['work', '업무'], ['life', '개인'], ['study', '공부']].forEach(function (pair) {
      var count = pair[0] === 'all' ? mine.length : mine.filter(function (t) { return t.category === pair[0]; }).length;
      var chip = el('button', 'chip' + (filter === pair[0] ? ' on' : ''), pair[1]);
      chip.type = 'button';
      chip.appendChild(el('em', null, String(count)));
      chip.onclick = function () { filter = pair[0]; render(); };
      box.appendChild(chip);
    });
  }

  function renderSummary(mine) {
    var done = mine.filter(function (t) { return t.done; }).length;
    var pct = mine.length ? Math.round((done / mine.length) * 100) : 0;
    document.getElementById('pct').firstChild.textContent = pct + '%';
    document.getElementById('pctSub').textContent = mine.length + '개 중 ' + done + '개 완료';
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('dueToday').textContent = mine.filter(function (t) {
      var label = dueLabel(t.due); return !t.done && label && label.today;
    }).length;
    document.getElementById('highCount').textContent = mine.filter(function (t) {
      return !t.done && t.priority === 'high';
    }).length;
  }

  function render() {
    var email = currentEmail();
    var signedIn = Boolean(email);
    authEl.hidden = signedIn;
    appEl.hidden = !signedIn;
    document.getElementById('who').hidden = !signedIn;
    document.getElementById('logout').hidden = !signedIn;
    if (!signedIn) return;
    document.getElementById('whoEmail').textContent = email;

    var mine = myTodos();
    renderSummary(mine);
    renderFilters(mine);

    var list = document.getElementById('list');
    list.innerHTML = '';
    var shown = mine.filter(function (t) { return filter === 'all' || t.category === filter; });

    shown.forEach(function (todo) {
      var li = el('li', 'card todo' + (todo.done ? ' done' : '') + (todo.id === freshId ? ' fresh' : ''));

      var check = el('button', 'check');
      check.type = 'button';
      check.setAttribute('aria-label', todo.done ? '완료 취소' : '완료');
      check.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      check.onclick = function () {
        saveMine(myTodos().map(function (t) { return t.id === todo.id ? Object.assign({}, t, { done: !t.done }) : t; }));
        render();
      };

      var body = el('div', 'body');
      body.appendChild(el('div', 'title', todo.text));
      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'tag ' + todo.category, CATEGORY[todo.category]));
      var prio = el('span', 'prio ' + todo.priority);
      prio.appendChild(el('i'));
      prio.appendChild(document.createTextNode(PRIORITY[todo.priority]));
      meta.appendChild(prio);
      var due = dueLabel(todo.due);
      if (due) meta.appendChild(el('span', 'due' + (due.today && !todo.done ? ' today' : ''), due.text));
      body.appendChild(meta);

      var remove = el('button', 'remove', '×');
      remove.type = 'button';
      remove.setAttribute('aria-label', '삭제');
      remove.onclick = function () {
        saveMine(myTodos().filter(function (t) { return t.id !== todo.id; }));
        render();
      };

      li.appendChild(check);
      li.appendChild(body);
      li.appendChild(remove);
      list.appendChild(li);
    });

    document.getElementById('empty').hidden = shown.length > 0;
    freshId = null;
  }

  document.getElementById('authForm').onsubmit = function (event) {
    event.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!backendReady()) {
      document.getElementById('apiFail').hidden = false;
      errorEl.hidden = true;
      return;
    }
    document.getElementById('apiFail').hidden = true;

    var users = read(USERS, {});
    var firstTime = false;

    if (mode === 'signup') {
      if (password.length < 8) return fail('비밀번호는 8자 이상이어야 합니다.');
      if (users[email]) return fail('이미 가입된 이메일입니다. 로그인해 주세요.');
      users[email] = password;
      write(USERS, users);
      firstTime = true;
    } else {
      if (!users[email]) return fail('가입되지 않은 이메일입니다.');
      if (users[email] !== password) return fail('비밀번호가 맞지 않습니다.');
    }

    write(SESSION, email);
    if (firstTime) {
      saveMine(sampleTodos());
      document.getElementById('sampleNote').hidden = false;
    }
    document.getElementById('password').value = '';
    errorEl.hidden = true;
    render();
  };

  document.getElementById('addForm').onsubmit = function (event) {
    event.preventDefault();
    var field = document.getElementById('newTodo');
    var text = field.value.trim();
    if (!text) return;

    var todo = {
      id: 't' + Date.now(),
      text: text,
      category: document.getElementById('newCategory').value,
      priority: document.getElementById('newPriority').value,
      due: dueIn(document.getElementById('newDue').value),
      done: false,
    };
    saveMine([todo].concat(myTodos()));
    freshId = todo.id;
    filter = 'all';
    field.value = '';
    render();
  };

  document.getElementById('dismissNote').onclick = function () {
    document.getElementById('sampleNote').hidden = true;
  };

  document.getElementById('logout').onclick = function () {
    write(SESSION, null);
    setMode('login');
    render();
  };

  function paintApiBadge() {
    var ready = backendReady();
    var badge = document.getElementById('apiBadge');
    badge.className = 'badge' + (ready ? ' up' : '');
    document.getElementById('apiBadgeText').textContent = ready ? 'API 연결됨' : 'API 연결 안 됨';
    if (ready) document.getElementById('apiFail').hidden = true;
  }

  setInterval(paintApiBadge, 500);
  paintApiBadge();

  setMode(currentEmail() ? 'login' : 'signup');
  render();
})();
</script>
</body>
</html>
