<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f2ff"/><stop offset="1" stop-color="#e6f2f8"/></linearGradient></defs><rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="75" fill="#fbfaff"/><g font-family="sans-serif"><text x="60" y="49" fill="#25203f" font-size="32" font-weight="900">a✳ axiom.</text><text x="800" y="45" fill="#25203f" font-size="13">기능　　 작동 방식　　 인사이트</text><rect x="450" y="130" width="300" height="40" rx="20" fill="white"/><text x="480" y="156" fill="#7354dc" font-size="14">✧ 더 명확한 결정을 위한 새로운 기준 →</text><text x="600" y="280" text-anchor="middle" fill="#25203f" font-size="74" font-weight="900">데이터가 답이 되는</text><text x="600" y="370" text-anchor="middle" fill="#7155dc" font-size="76" font-style="italic">바로 그 순간.</text><text x="600" y="450" text-anchor="middle" fill="#777181" font-size="18">흩어진 숫자를 하나의 방향으로. AXIOM은 팀의 모든 데이터를 연결하고,</text><text x="600" y="480" text-anchor="middle" fill="#777181" font-size="18">복잡한 분석을 누구나 이해할 수 있는 인사이트로 바꿉니다.</text><rect x="450" y="520" width="190" height="50" rx="10" fill="#7155dc"/><text x="479" y="552" fill="white" font-size="16">AXIOM 살펴보기 ↗</text><rect x="75" y="625" width="1050" height="300" rx="24" fill="#25203f"/><text x="110" y="675" fill="#d7f190" font-size="30">a✳</text><text x="175" y="675" fill="white" font-size="16">Overview　⌄</text><path d="M175 702 H1090" stroke="#504b65"/><text x="175" y="733" fill="#aaa5bb" font-size="12" letter-spacing="2">PERFORMANCE OVERVIEW</text></g></svg>
